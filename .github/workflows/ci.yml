name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch so a new push supersedes an old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Wails links against webkit2gtk on Linux — needed even for `go test`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          sudo apt-get install -y libwebkit2gtk-4.0-dev 2>/dev/null || \
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, which is gitignored. A placeholder is
      # enough for vet/test; the real bundle is only needed for `wails build`.
      - name: Stub frontend/dist for go:embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  vue:
    name: Test (Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Test
        run: pnpm test
        working-directory: frontend
