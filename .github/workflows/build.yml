name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: build/bin/gitconfig-app
            asset: gitconfig-app-linux-amd64

          - os: windows-latest
            artifact: build/bin/gitconfig-app.exe
            asset: gitconfig-app-windows-amd64.exe

          - os: macos-13
            artifact: gitconfig-app-macos-amd64.zip
            asset: gitconfig-app-macos-amd64.zip

          - os: macos-latest
            artifact: gitconfig-app-macos-arm64.zip
            asset: gitconfig-app-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          sudo apt-get install -y libwebkit2gtk-4.0-dev 2>/dev/null || \
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Build
        run: wails build

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: zip -r "${{ matrix.artifact }}" build/bin/gitconfig-app.app

      - name: Upload release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ matrix.artifact }}#${{ matrix.asset }}"
